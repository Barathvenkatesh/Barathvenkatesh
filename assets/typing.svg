<svg xmlns="http://www.w3.org/2000/svg" width="660" height="70" viewBox="0 0 660 70" fill="none" role="img" aria-label="Typing introduction">
  <style>
    .t {
      font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
      font-size: 24px;
      font-weight: 700;
      fill: #c4b5fd;
      letter-spacing: 0.4px;
    }
    .cursor { fill: #22d3ee; }
  </style>

  <text class="t" x="0" y="42" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    Hi, I&#39;m Barath Venkatesh
  </text>

  <text class="t" x="0" y="42" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="4s" begin="4s" repeatCount="indefinite"/>
    Full-Stack &amp; Python Developer
  </text>

  <text class="t" x="0" y="42" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="4s" begin="8s" repeatCount="indefinite"/>
    Building real-time web apps
  </text>

  <text class="t" x="0" y="42" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="4s" begin="12s" repeatCount="indefinite"/>
    Learning in public, one commit at a time
  </text>

  <rect class="cursor" x="0" y="16" width="14" height="30" rx="2" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0;0.85" keyTimes="0;0.45;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
